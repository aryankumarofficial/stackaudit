name: CI

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  quality:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run typecheck
        run: bunx tsc --noEmit

      - name: Run Lint
        run: bun run lint

      - name: Run Tests
        run: bun run test

      - name: Build Application
        run: bun run build
